name: Verify simulation curriculum
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'simulations-v3.js'
      - 'repair-dialogues.js'
      - 'build.mjs'
      - 'content.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/simulation-qa.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check content.js && node --check simulations-v3.js && node --check repair-dialogues.js
      - run: node tests/simulation-check.mjs
      - name: Verify actual Netlify output
        run: |
          node build.mjs
          test -s dist/simulations-v3.js
          test -s dist/repair-dialogues.js
          test -s dist/app.js
          test -s dist/index.html
      - name: Check UI in Chromium
        run: |
          npm install --no-save playwright-core@1.56.1
          which google-chrome
          node tests/browser.mjs

name: Expand application sources
on:
  push:
    branches: [main]
    paths: ['archive/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand packaged source
        run: node build.mjs --expand-to-root
      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js content.js style.css icon.svg manifest.webmanifest sw.js _headers README.md netlify.toml
          if ! git diff --cached --quiet; then
            git commit -m "Expand readable application sources [skip ci]"
            git push
          fi
